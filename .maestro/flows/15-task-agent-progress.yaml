# #113 — Real agent execution. This requires a live maestro-gateway and model
# credentials, so CI excludes it with the established agent-backend tag.
appId: com.logact.utralTodo
tags:
  - agent-backend
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login-as.yaml
    env:
      MAESTRO_LOGIN_ID: maestro-e2e
      MAESTRO_LOGIN_NAME: Maestro E2E
- runFlow: ../subflows/seed.yaml
- runScript: ../scripts/seed-gateway.js
- runScript: ../scripts/seed-organization.js
- tapOn:
    id: tab-tasks
- tapOn:
    id: task-create
- tapOn:
    id: task-form-title
- inputText: ${output.agentTaskTitle}
- pressKey: enter
- tapOn:
    id: task-form-description
- inputText: Execute the delegated agent workflow and report progress
- pressKey: enter
- tapOn:
    id: task-form-department
- tapOn:
    id: department-picker-${output.platformDepartmentId}
- tapOn:
    id: task-form-target
- tapOn:
    id: task-target-type-participant
- tapOn:
    id: task-target-participant-${output.taskAgentId}
- tapOn:
    id: task-form-skill-tags
- inputText: automation
- pressKey: enter
- tapOn:
    id: task-form-submit
- tapOn:
    id: task-action-assign
- extendedWaitUntil:
    visible:
      id: candidate-item-${output.taskAgentId}
    timeout: 15000
- assertVisible:
    id: candidate-presence-${output.taskAgentId}
- assertVisible: AGENT
- tapOn:
    id: candidate-select-${output.taskAgentId}
- tapOn:
    id: assignment-reviewer
- tapOn:
    id: participant-option-maestro-ben
- tapOn:
    id: assignment-review
- tapOn:
    id: assignment-confirm-submit

# The task room subscription surfaces MQTT task.event history and the agent's
# room-message execution narrative without polling-only UI simulation.
- extendedWaitUntil:
    visible:
      id: task-person-presence-${output.taskAgentId}
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: task-execution-progress
    timeout: 180000
- assertVisible:
    id: task-event-progress
- assertVisible:
    id: task-room-open
- extendedWaitUntil:
    visible:
      id: task-status-review
    timeout: 180000
- takeScreenshot: 15-agent-task-ready-for-review
