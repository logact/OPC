# #130 — Human task lifecycle on the simplified task center: create a draft,
# direct-assign it (no recommendation / reviewer / collaborator), execute
# start → block → resume → submit → completed (no review step), create+assign
# in one screen, and edit + cancel a draft. Scopes are Created / Assigned only.
# #132 adds a separate parent/subtask journey at the end of this flow.
appId: com.logact.opc
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login-as.yaml
    env:
      MAESTRO_LOGIN_ID: maestro-e2e
- runFlow: ../subflows/seed.yaml
- runScript: ../scripts/seed-gateway.js
- runScript: ../scripts/seed-organization.js
- tapOn:
    id: tab-tasks
- extendedWaitUntil:
    visible:
      id: screen-tasks
    timeout: 15000

# Only the two role-based scopes exist; the old composed scopes are gone.
- assertVisible:
    id: task-scope-created
- assertVisible:
    id: task-scope-assigned
- assertNotVisible:
    id: task-scope-collaborating
- assertNotVisible:
    id: task-scope-review
- assertNotVisible:
    id: task-scope-managed

# Draft creation: inline title validation, no department / target / skill-tags.
- tapOn:
    id: task-create
- tapOn:
    id: task-form-submit
- assertVisible:
    id: task-form-error-title
- tapOn:
    id: task-form-title
- inputText: ${output.humanTaskTitle}
- pressKey: enter
- tapOn:
    id: task-form-description
- inputText: Implement and verify the simplified mobile task workflow
- tapOn: Create task
- scrollUntilVisible:
    element:
      id: task-form-submit
    direction: DOWN
- tapOn:
    id: task-form-submit
- extendedWaitUntil:
    visible: ${output.humanTaskTitle}
    timeout: 15000
- assertVisible:
    id: task-status-draft

# Direct assignment: a plain participant picker with an optional reason and a
# single confirm — no recommendation scores or two-step role confirmation.
- tapOn:
    id: task-action-assign
- extendedWaitUntil:
    visible:
      id: screen-task-assignment
    timeout: 10000
- scrollUntilVisible:
    element:
      id: assignee-option-maestro-alice
    direction: DOWN
- tapOn:
    id: assignee-option-maestro-alice
- scrollUntilVisible:
    element:
      id: assignment-reason
    direction: DOWN
- tapOn:
    id: assignment-reason
- inputText: Alice owns the mobile workflow
- pressKey: enter
- scrollUntilVisible:
    element:
      id: assignment-confirm-submit
    direction: DOWN
- tapOn:
    id: assignment-confirm-submit
- extendedWaitUntil:
    visible:
      id: task-status-assigned
    timeout: 15000

# Assignee starts, blocks, resumes, and submits; submit goes straight to
# completed — there is no review status and no reviewer.
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login-as.yaml
    env:
      MAESTRO_LOGIN_ID: maestro-alice
- tapOn:
    id: tab-tasks
- tapOn:
    id: task-scope-assigned
- extendedWaitUntil:
    visible: ".*${output.humanTaskTitle}.*"
    timeout: 15000
- tapOn: ".*${output.humanTaskTitle}.*"
- tapOn:
    id: task-action-start
- extendedWaitUntil:
    visible:
      id: task-status-in_progress
    timeout: 10000
- tapOn:
    id: task-action-block
- scrollUntilVisible:
    element:
      id: task-block-reason
    direction: DOWN
- tapOn:
    id: task-block-reason
- inputText: Waiting for acceptance input
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-block-submit
    direction: DOWN
- tapOn:
    id: task-block-submit
- extendedWaitUntil:
    visible:
      id: task-status-blocked
    timeout: 10000
- tapOn:
    id: task-action-resume
- scrollUntilVisible:
    element:
      id: task-resume-reason
    direction: DOWN
- tapOn:
    id: task-resume-reason
- inputText: Acceptance input received
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-resume-submit
    direction: DOWN
- tapOn:
    id: task-resume-submit
- extendedWaitUntil:
    visible:
      id: task-status-in_progress
    timeout: 10000
- tapOn:
    id: task-action-submit
- scrollUntilVisible:
    element:
      id: task-result-summary
    direction: DOWN
- tapOn:
    id: task-result-summary
- inputText: Result ready without a review step
- tapOn:
    id: task-status-in_progress
- scrollUntilVisible:
    element:
      id: task-result-submit
    direction: DOWN
- tapOn:
    id: task-result-submit
- extendedWaitUntil:
    visible:
      id: task-status-completed
    timeout: 10000

# The creator finds the completed task in the Created scope.
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login-as.yaml
    env:
      MAESTRO_LOGIN_ID: maestro-e2e
- tapOn:
    id: tab-tasks
- tapOn:
    id: task-scope-created
- extendedWaitUntil:
    visible: ".*${output.humanTaskTitle}.*"
    timeout: 15000

# Create + assign in one screen: picking an assignee in the form creates the
# task directly in assigned status.
- tapOn:
    id: task-create
- tapOn:
    id: task-form-title
- inputText: ${output.directTaskTitle}
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-form-assignee
    direction: DOWN
- tapOn:
    id: task-form-assignee
- scrollUntilVisible:
    element:
      id: task-form-assignee-option-maestro-ben
    direction: DOWN
- tapOn:
    id: task-form-assignee-option-maestro-ben
- scrollUntilVisible:
    element:
      id: task-form-submit
    direction: DOWN
- tapOn:
    id: task-form-submit
- extendedWaitUntil:
    visible:
      id: task-status-assigned
    timeout: 15000
- tapOn: ‹ Back
- extendedWaitUntil:
    visible:
      id: screen-tasks
    timeout: 10000

# Creator edit and cancel paths remain available on a draft.
- tapOn:
    id: task-create
- tapOn:
    id: task-form-title
- inputText: ${output.cancelledTaskTitle}
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-form-submit
    direction: DOWN
- tapOn:
    id: task-form-submit
- extendedWaitUntil:
    visible:
      id: task-status-draft
    timeout: 10000
- tapOn:
    id: task-action-edit
- tapOn:
    id: task-form-description
- inputText: Edited before cancellation
- tapOn: Edit task
- scrollUntilVisible:
    element:
      id: task-form-submit
    direction: DOWN
- tapOn:
    id: task-form-submit
- assertVisible: Edited before cancellation
- tapOn:
    id: task-action-cancel
- scrollUntilVisible:
    element:
      id: task-cancel-reason
    direction: DOWN
- tapOn:
    id: task-cancel-reason
- inputText: No longer needed
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-cancel-submit
    direction: DOWN
- tapOn:
    id: task-cancel-submit
- extendedWaitUntil:
    visible:
      id: task-status-cancelled
    timeout: 10000

# Task decomposition: creators may add independently managed child tasks. The
# child detail links back to its parent, whose progress remains server-derived.
- tapOn: ‹ Back
- extendedWaitUntil:
    visible:
      id: screen-tasks
    timeout: 10000
- tapOn:
    id: task-create
- tapOn:
    id: task-form-title
- inputText: ${output.decompositionTaskTitle}
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-form-submit
    direction: DOWN
- tapOn:
    id: task-form-submit
- extendedWaitUntil:
    visible:
      id: task-status-draft
    timeout: 10000
- tapOn:
    id: task-action-decompose
- extendedWaitUntil:
    visible:
      id: screen-task-form
    timeout: 10000
- tapOn:
    id: task-form-title
- inputText: ${output.subtaskTitle}
- pressKey: enter
- scrollUntilVisible:
    element:
      id: task-form-submit
    direction: DOWN
- tapOn:
    id: task-form-submit
- extendedWaitUntil:
    visible:
      id: task-parent-open
    timeout: 10000
- tapOn:
    id: task-parent-open
- assertVisible:
    id: task-progress-summary
- takeScreenshot: 14-task-human-completed
