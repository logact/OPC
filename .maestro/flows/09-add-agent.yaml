# F6 — Add Agent: pick a gateway, fill the model form (provider/model/api key),
# validation toast, success path registers the agent via the gateway and opens
# its DM.
appId: com.logact.utralTodo
tags:
  - core
---
- launchApp
- runFlow: ../subflows/login.yaml
- runScript: ../scripts/seed-gateway.js
- tapOn:
    id: tab-addagent

# --- screen contract ---
- assertVisible: Add Agent
- extendedWaitUntil:
    visible:
      id: addagent-hint
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-gateways-refresh
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-name-input
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-provider-anthropic
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-provider-openrouter
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-model-input
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-apikey-input
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-submit
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: addagent-cancel
    timeout: 10000

# --- gateway picker: the seeded gateway is listed and selectable ---
- extendedWaitUntil:
    visible:
      id: addagent-gateway-item-maestro-gateway
    timeout: 10000
- tapOn:
    id: addagent-gateway-item-maestro-gateway

# --- validation: empty fields -> error toast ---
- tapOn:
    id: addagent-submit
- extendedWaitUntil:
    visible:
      id: toast
    timeout: 10000
- assertVisible: Name and model id required

# --- fill the agent info form ---
- tapOn:
    id: addagent-name-input
- inputText: Review Bot
# keyboard: iOS 26 hides it from XCUITest, use Enter to blur (see login subflow)
- pressKey: enter
- tapOn:
    id: addagent-provider-openai
- tapOn:
    id: addagent-model-input
- inputText: gpt-5
- pressKey: enter
- tapOn:
    id: addagent-submit

# --- success toast, then the DM with the new agent opens automatically ---
- extendedWaitUntil:
    visible:
      id: toast
    timeout: 10000
- assertVisible: Agent added
- extendedWaitUntil:
    visible:
      id: room-input
    timeout: 15000
- assertVisible: Review Bot
- takeScreenshot: 09-agent-added

# --- new agent is listed in Contacts ---
- tapOn:
    id: room-back
- tapOn:
    id: tab-contacts
- assertVisible: Review Bot

# --- cancel returns to chats without saving ---
- tapOn:
    id: tab-addagent
- tapOn:
    id: addagent-cancel
- extendedWaitUntil:
    visible:
      id: conv-list
    timeout: 10000
