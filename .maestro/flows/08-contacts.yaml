# F9 — Contacts: agents/gateways/humans sections by server-side kind, AGENT /
# GATEWAY tags, tapping a contact opens the 1v1 DM.
appId: com.logact.utralTodo
tags:
  - core
---
- launchApp
- runFlow: ../subflows/login.yaml
- runFlow: ../subflows/seed.yaml
- runScript: ../scripts/seed-gateway.js
- tapOn:
    id: tab-contacts

# --- screen contract ---
- assertVisible: Contacts
- extendedWaitUntil:
    visible:
      id: contacts-search
    timeout: 10000
- assertVisible: Search contacts

# --- sections by server-side kind ---
- extendedWaitUntil:
    visible:
      id: contacts-section-agents
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: contacts-section-gateways
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: contacts-section-humans
    timeout: 10000

# --- seeded agent row: name, AGENT tag, subtitle ---
- extendedWaitUntil:
    visible:
      id: contact-item-maestro-codebot
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: contact-tag-agent-maestro-codebot
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: contact-subtitle-maestro-codebot
    timeout: 10000

# --- seeded gateway row: GATEWAY tag ---
- extendedWaitUntil:
    visible:
      id: contact-item-maestro-gateway
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: contact-tag-gateway-maestro-gateway
    timeout: 10000

# --- seeded human row ---
- extendedWaitUntil:
    visible:
      id: contact-item-maestro-alice
    timeout: 10000
- takeScreenshot: 08-contacts

# --- tapping an agent opens the 1v1 DM ---
- tapOn:
    id: contact-item-maestro-codebot
- extendedWaitUntil:
    visible:
      id: room-input
    timeout: 10000
- assertVisible: Code Bot
