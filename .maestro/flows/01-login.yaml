# F1 — Login (#124): fresh app shows login, successful password login lands on Chats tab.
appId: com.logact.opc
tags:
  - smoke
env:
  MAESTRO_USER_ID: maestro-e2e
  MAESTRO_PASSWORD: maestro-e2e-password
---
- launchApp:
    clearState: true

# 保证登录用户存在且密码已知（hardened server 上匿名注册不可用）
- runScript: ../scripts/seed-participants.js

# --- login screen renders (dark theme redesign keeps this screen) ---
# first screen after a cold start: the initial JS bundle load can take
# minutes on CI, so the first wait is generous (later ones stay tight)
- extendedWaitUntil:
    visible:
      id: login-id-input
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: login-password-input
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: login-submit
    timeout: 10000

# --- validation: empty id shows an inline error and must not navigate away ---
# (inline error instead of a native Alert — iOS 26.5 simulators don't expose
# alert windows to XCUITest, so e2e can't dismiss them)
- tapOn:
    id: login-submit
# On a cold CI bundle the first native tap can be consumed by Pressable's
# initial pressed-state transition before its JS handler is ready. Submitting
# the same empty form again is idempotent and keeps the validation assertion
# deterministic without retrying the flow itself.
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: login-error
    timeout: 10000
- assertVisible: 请输入参与者 ID
- extendedWaitUntil:
    visible:
      id: login-id-input
    timeout: 10000

# --- successful login lands on the Chats tab with the tab bar ---
- tapOn:
    id: login-id-input
- inputText: ${MAESTRO_USER_ID}
- tapOn:
    id: login-password-input
- inputText: ${MAESTRO_PASSWORD}
# iOS 26 simulators don't expose the keyboard to XCUITest (hideKeyboard fails);
# single-line inputs blur on submit (Enter) instead
- pressKey: enter
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: tab-chats
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: chats-title
    timeout: 10000
- assertVisible: OPC IM
- takeScreenshot: 01-chats-after-login
