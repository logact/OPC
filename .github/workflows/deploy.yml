name: Deploy to Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy (e.g. latest, main, sha-xxx, 1.0.1)'
        required: true
        default: 'latest'
        type: string
      ref:
        description: 'Git ref to checkout for deployment files (e.g. main, release-x.y.z)'
        required: true
        default: 'main'
        type: string
      reset_postgres:
        description: 'Reset PostgreSQL data volume (will delete existing postgres data)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Compute image tag
        id: image
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # 配置了 ACR(vars.ACR_REGISTRY)时优先从 ACR 拉取(issue #81:部署机到 ghcr 带宽不稳定)
          if [ -n "${{ vars.ACR_REGISTRY }}" ]; then
            echo "server-image=${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/opc-server:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "server-image=ghcr.io/${REPO}/opc-server:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi
          MOSQ="${{ vars.MOSQUITTO_IMAGE }}"
          if [ -z "$MOSQ" ]; then
            if [ -n "${{ vars.ACR_REGISTRY }}" ]; then
              MOSQ="${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/opc-mosquitto:latest"
            else
              MOSQ="ghcr.io/logact/opc-mosquitto:latest"
            fi
          fi
          echo "mosquitto-image=${MOSQ}" >> "$GITHUB_OUTPUT"

      - name: Resolve compose file and config
        id: resolve
        run: |
          ENV="${{ github.event.inputs.environment }}"
          case "$ENV" in
            development)
              echo "compose_file=docker-compose.dev.yml" >> "$GITHUB_OUTPUT"
              echo "mosquitto_conf=mosquitto.conf" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "compose_file=docker-compose.staging.yml" >> "$GITHUB_OUTPUT"
              echo "mosquitto_conf=mosquitto.staging.conf" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "compose_file=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
              echo "mosquitto_conf=mosquitto.prod.conf" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ vars.SERVER_HOST }}
            Port ${{ vars.SERVER_SSH_PORT || '22' }}
            User ${{ vars.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Sync deployment files
        run: |
          DEPLOY_DIR="${{ vars.SERVER_DIR }}"
          COMPOSE_FILE="${{ steps.resolve.outputs.compose_file }}"
          MOSQUITTO_CONF="${{ steps.resolve.outputs.mosquitto_conf }}"
          ssh deploy "mkdir -p ${DEPLOY_DIR}/docker/mosquitto"
          ssh deploy "cd ${DEPLOY_DIR} && docker compose down --remove-orphans 2>/dev/null || true"
          ssh deploy "docker run --rm -v ${DEPLOY_DIR}/docker/mosquitto:/mnt alpine sh -c 'rm -rf /mnt/mosquitto.conf /mnt/${MOSQUITTO_CONF}'"
          scp "$COMPOSE_FILE" deploy:"${DEPLOY_DIR}/docker-compose.yml"
          scp docker/mosquitto/Dockerfile deploy:"${DEPLOY_DIR}/docker/mosquitto/"
          scp "docker/mosquitto/${MOSQUITTO_CONF}" deploy:"${DEPLOY_DIR}/docker/mosquitto/mosquitto.conf"

      - name: Generate .env on server
        run: |
          DEPLOY_DIR="${{ vars.SERVER_DIR }}"
          DATABASE_URL_LINE=""
          if [ -n "${{ vars.DATABASE_URL }}" ]; then
            DATABASE_URL_LINE="DATABASE_URL=${{ vars.DATABASE_URL }}"
          fi
          ssh deploy "cat > \"${DEPLOY_DIR}/.env\" <<'ENV_EOF'
          PORT=${{ vars.PORT || '3000' }}
          POSTGRES_USER=${{ vars.POSTGRES_USER || 'opc' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ vars.POSTGRES_DB || 'opc' }}
          ${DATABASE_URL_LINE}
          MQTT_BROKER_URL=${{ vars.MQTT_BROKER_URL || 'mqtt://mosquitto:1883' }}
          MQTT_SERVER_USERNAME=${{ vars.MQTT_SERVER_USERNAME || '__server__' }}
          MQTT_SERVER_PASSWORD=${{ secrets.MQTT_SERVER_PASSWORD }}
          MQTT_PORT=${{ vars.MQTT_PORT || '1883' }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SERVER_IMAGE=${{ steps.image.outputs.server-image }}
          MOSQUITTO_IMAGE=${{ steps.image.outputs.mosquitto-image }}
          ENV_EOF"
          ssh deploy "chmod 600 \"${DEPLOY_DIR}/.env\""

      - name: Login deploy host to ACR
        if: ${{ vars.ACR_REGISTRY != '' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | ssh deploy "docker login --username '${{ secrets.ACR_USERNAME }}' --password-stdin ${{ vars.ACR_REGISTRY }}"

      - name: Reset PostgreSQL data (optional)
        if: ${{ github.event.inputs.reset_postgres == 'true' }}
        run: |
          ssh deploy <<'RESET_EOF'
            set -e
            cd "${{ vars.SERVER_DIR }}"
            docker compose down --remove-orphans 2>/dev/null || true
            docker volume ls -q -f name=postgres_data | xargs -r docker volume rm 2>/dev/null || true
          RESET_EOF

      - name: Deploy
        run: |
          ssh deploy <<'DEPLOY_EOF'
            set -e
            cd "${{ vars.SERVER_DIR }}"

            # Step 1: Stop and remove ALL opc containers (any tag/version)
            for pattern in "opc-server" "opc-mosquitto"; do
              container_ids=$(docker ps -a --filter "name=${pattern}" --format '{{.ID}}' 2>/dev/null || true)
              if [ -n "$container_ids" ]; then
                echo "Stopping containers matching '${pattern}': $container_ids"
                echo "$container_ids" | xargs -r docker stop
                echo "$container_ids" | xargs -r docker rm -f
              fi
            done

            # Step 2: Also remove any containers using opc images directly
            docker ps -a --format '{{.ID}} {{.Image}}' 2>/dev/null \
              | grep -E "logact/opc-(server|mosquitto)" \
              | awk '{print $1}' \
              | xargs -r docker rm -f 2>/dev/null || true

            # Step 3: Clean up compose stack
            docker compose down --remove-orphans 2>/dev/null || true

            # Step 4: Start fresh
            docker compose pull
            docker compose up -d postgres
            docker compose run --rm migrations < /dev/null
            docker compose up -d mosquitto server
            docker compose ps
            docker system prune -f
          DEPLOY_EOF

      - name: Health check
        run: |
          echo "Waiting for server healthcheck..."
          ssh deploy <<EOF
            cd "${{ vars.SERVER_DIR }}"
            docker compose ps
            echo "Checking server health endpoint..."
            for i in {1..30}; do
              if docker compose exec -T server node -e "fetch('http://localhost:${{ vars.PORT || '3000' }}/openapi.json').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" < /dev/null; then
                echo "Server is healthy"
                exit 0
              fi
              echo "Health check retry \${i}/30..."
              sleep 2
            done
            echo "Server health check failed"
            echo "--- server logs ---"
            docker compose logs server --tail=50
            echo "--- mosquitto logs ---"
            docker compose logs mosquitto --tail=50
            exit 1
          EOF
