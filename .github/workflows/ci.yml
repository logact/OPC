name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  vars:
    name: Compute Variables
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.var.outputs.node-version }}
      pnpm-version: ${{ steps.var.outputs.pnpm-version }}
      version: ${{ steps.var.outputs.version }}
      source-hash: ${{ steps.source.outputs.hash }}
      docker-tag: ${{ steps.docker.outputs.tag }}
      lowercase-repo: ${{ steps.var.outputs.lowercase-repo }}
      mobile-changed: ${{ steps.mobile-changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - id: source
        run: |
          tar -cf /tmp/source.tar \
            --sort=name --owner=0 --group=0 --mtime='1970-01-01' \
            --exclude='.git' --exclude='.github' \
            --exclude='**/dist' --exclude='**/*.tsbuildinfo' \
            .
          HASH=$(sha256sum /tmp/source.tar | awk '{print $1}')
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - id: var
        run: |
          NODE=$(node -p "require('./package.json').engines.node.match(/\\d+/)[0]")
          PNPM=$(node -p "require('./package.json').packageManager.match(/pnpm@(.+)/)[1]")
          VERSION=$(node -p "require('./apps/server/package.json').version")
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "node-version=${NODE}" >> "$GITHUB_OUTPUT"
          echo "pnpm-version=${PNPM}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "lowercase-repo=${REPO}" >> "$GITHUB_OUTPUT"

      - id: docker
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            TAG="pr-${{ github.event.number }}"
          else
            TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # mobile e2e 只在 mobile app / maestro 套件 / mobile 依赖的共享包变更时运行（很重的 job）
      - id: mobile-changes
        run: |
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            git fetch origin "${{ github.base_ref }}" --quiet
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo '.maestro/')
          fi
          if echo "$CHANGED" | grep -qE '^(\.maestro/|apps/mobile/|packages/(protocol|sdk|api-client|mqtt-client)/|pnpm-lock\.yaml)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Monorepo
    needs: vars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ needs.vars.outputs.node-version }}
          pnpm-version: ${{ needs.vars.outputs.pnpm-version }}

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-dist
          path: |
            apps/*/dist/
            packages/*/dist/
            apps/*/package.json
            packages/*/package.json
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
          retention-days: 1
          include-hidden-files: true

  checks:
    name: Code Checks
    needs: [vars, build]
    uses: ./.github/workflows/ci-checks.yml
    with:
      node-version: ${{ needs.vars.outputs.node-version }}
      pnpm-version: ${{ needs.vars.outputs.pnpm-version }}

  test:
    name: Tests
    needs: [vars, build]
    uses: ./.github/workflows/ci-test.yml
    with:
      node-version: ${{ needs.vars.outputs.node-version }}
      pnpm-version: ${{ needs.vars.outputs.pnpm-version }}
      # main 分支 push / tag push 上测试失败自动重试 2 次，PR 上不重试
      retries: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 2 || 0 }}

  mobile-e2e-label-check:
    name: Check Mobile E2E Issue Label
    needs: vars
    runs-on: ubuntu-latest
    outputs:
      run-mobile-e2e: ${{ steps.check.outputs.run-mobile-e2e }}
    steps:
      - name: Check linked issue for mobileE2E label
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MOBILE_CHANGED: ${{ needs.vars.outputs.mobile-changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "run-mobile-e2e=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Not a PR event; skipping mobile e2e label check"
            exit 0
          fi

          if [[ "$MOBILE_CHANGED" != "true" ]]; then
            echo "Mobile files not changed; skipping label check"
            exit 0
          fi

          # Extract issue numbers from PR body (#123 or /issues/123)
          ISSUES=$(echo "$PR_BODY" | grep -oE '(#|issues/)[0-9]+' | sed -E 's/#|issues\///' | sort -u)
          if [[ -z "$ISSUES" ]]; then
            echo "No linked issues found in PR body"
            exit 0
          fi

          for ISSUE in $ISSUES; do
            echo "Checking issue #$ISSUE"
            if gh issue view "$ISSUE" --repo '${{ github.repository }}' --json labels --jq '.labels[].name' 2>/dev/null | grep -qx 'mobileE2E'; then
              echo "Issue #$ISSUE has mobileE2E label"
              echo "run-mobile-e2e=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No linked issue has mobileE2E label"

  mobile-bundle:
    name: Mobile Bundle Check
    needs: [vars, build, checks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ needs.vars.outputs.node-version }}
          pnpm-version: ${{ needs.vars.outputs.pnpm-version }}

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dist
          path: .

      - name: Bundle JavaScript (Android)
        working-directory: apps/mobile
        run: pnpm bundle:android

      - name: Bundle JavaScript (iOS)
        working-directory: apps/mobile
        run: pnpm bundle:ios

  mobile-e2e:
    name: Mobile E2E (Maestro)
    needs: [vars, build, checks, test, mobile-e2e-label-check]
    if: needs.vars.outputs.mobile-changed == 'true' && needs.mobile-e2e-label-check.outputs.run-mobile-e2e == 'true'
    uses: ./.github/workflows/ci-mobile-e2e.yml
    with:
      node-version: ${{ needs.vars.outputs.node-version }}
      pnpm-version: ${{ needs.vars.outputs.pnpm-version }}
    secrets:
      OPC_E2E_OWNER_TOKEN: ${{ secrets.OPC_E2E_OWNER_TOKEN }}

  docker:
    name: Docker Build & Push
    needs: [vars, build, checks, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-dist
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_PAT }}

      - name: Login to Aliyun ACR
        if: vars.ACR_REGISTRY != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.vars.outputs.lowercase-repo }}/opc-server:${{ needs.vars.outputs.docker-tag }}
            ghcr.io/${{ needs.vars.outputs.lowercase-repo }}/opc-server:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/opc-server:main', needs.vars.outputs.lowercase-repo) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/opc-server:latest', needs.vars.outputs.lowercase-repo) || '' }}
            ${{ vars.ACR_REGISTRY != '' && format('{0}/{1}/opc-server:{2}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, needs.vars.outputs.docker-tag) || '' }}
            ${{ vars.ACR_REGISTRY != '' && format('{0}/{1}/opc-server:sha-{2}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, github.sha) || '' }}
            ${{ vars.ACR_REGISTRY != '' && github.ref == 'refs/heads/main' && format('{0}/{1}/opc-server:main', vars.ACR_REGISTRY, vars.ACR_NAMESPACE) || '' }}
            ${{ vars.ACR_REGISTRY != '' && github.ref == 'refs/heads/main' && format('{0}/{1}/opc-server:latest', vars.ACR_REGISTRY, vars.ACR_NAMESPACE) || '' }}
          build-args: |
            NODE_VERSION=${{ needs.vars.outputs.node-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PACKAGE_NAME="opc-server"
          OWNER="${{ needs.vars.outputs.lowercase-repo }}"
          # 尝试设置为 public，首次创建时默认 private
          gh api \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PACKAGE_NAME}" \
            -f visibility=public 2>/dev/null || echo "⚠️ Could not set visibility (may already be public or not exist yet)"

  done:
    name: CI Done
    needs: [checks, test, docker, mobile-bundle, mobile-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          check_result() {
            local name="$1" result="$2"
            if [[ "$name" == "docker" && "$result" == "skipped" ]]; then
              return
            fi
            if [[ "$name" == "mobile-bundle" && "$result" == "skipped" ]]; then
              return
            fi
            if [[ "$name" == "mobile-e2e" && "$result" == "skipped" ]]; then
              return
            fi
            if [[ "$result" != "success" ]]; then
              echo "$name failed: $result"
              exit 1
            fi
          }
          check_result checks '${{ needs.checks.result }}'
          check_result test '${{ needs.test.result }}'
          check_result docker '${{ needs.docker.result }}'
          check_result mobile-bundle '${{ needs.mobile-bundle.result }}'
          check_result mobile-e2e '${{ needs.mobile-e2e.result }}'
          echo "All required jobs passed"
