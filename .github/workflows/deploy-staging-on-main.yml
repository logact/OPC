name: Deploy to Staging on Main

# CI 在 main 分支推送成功后，自动把该 commit 的镜像（sha-<commit> tag）部署到 staging 环境（issue #142）
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging-on-main
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to staging
    # 只处理 main 分支 push 触发的 CI（tag push 由 deploy-development-on-release 覆盖）
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger staging deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_TAG="sha-${{ github.event.workflow_run.head_sha }}"
          echo "Deploying image tag: ${IMAGE_TAG}"
          gh workflow run "Deploy to Environment" \
            --repo "${{ github.repository }}" \
            --ref main \
            -f environment=staging \
            -f image_tag="${IMAGE_TAG}" \
            -f ref=main
